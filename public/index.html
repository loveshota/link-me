<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系我 · Contact</title>
  <meta name="description" content="我的联系方式" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: #0f172a;
    }
    h1 { font-size: 22px; text-align: center; }
    .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin: 8px 0 26px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    a.link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }
    .icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: rgba(56, 189, 248, 0.12);
    }
    .label { font-size: 13px; color: var(--muted); }
    .value { font-size: 15px; word-break: break-all; }
    .empty, .error { text-align: center; color: var(--muted); font-size: 14px; padding: 12px 0; }
    .error { color: #f87171; }
    footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">L</div>
    <h1>Your Name</h1>
    <p class="subtitle">Your Tagline · 欢迎随时联系</p>

    <nav class="links" id="links">
      <p class="empty">加载中…</p>
    </nav>

    <footer>© <span id="year"></span> Your Name · <a href="/admin">管理</a></footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[char]));
    }

    function render(contacts) {
      const container = document.getElementById("links");
      if (!contacts.length) {
        container.innerHTML = '<p class="empty">暂无联系方式</p>';
        return;
      }
      container.innerHTML = contacts.map((item) => {
        const href = escapeHtml(item.href || "#");
        const external = /^https?:/i.test(item.href || "") ? ' target="_blank" rel="noopener noreferrer"' : "";
        return '<a class="link" href="' + href + '"' + external + '>' +
          '<span class="icon">' + escapeHtml(item.icon || "🔗") + "</span>" +
          '<span><span class="label">' + escapeHtml(item.label || "") + "</span><br />" +
          '<span class="value">' + escapeHtml(item.value || "") + "</span></span></a>";
      }).join("");
    }

    fetch("/api/contacts", { cache: "no-store" })
      .then((res) => res.json())
      .then((data) => render(Array.isArray(data.contacts) ? data.contacts : []))
      .catch(() => {
        document.getElementById("links").innerHTML = '<p class="error">加载失败，请稍后重试</p>';
      });
  </script>
</body>
</html>
