<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>管理后台 · Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      padding: 32px 16px;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 20px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }
    .hidden { display: none !important; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0b1220;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .field { margin-bottom: 14px; }
    button {
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #082f49; font-weight: 600; }
    button.danger { color: var(--danger); }
    button.small { padding: 6px 10px; font-size: 13px; }
    .row-head, .row {
      display: grid;
      grid-template-columns: 56px 1fr 1.2fr 1.6fr auto;
      gap: 8px;
      align-items: center;
    }
    .row-head { font-size: 12px; color: var(--muted); margin: 4px 0 8px; padding: 0 2px; }
    .row { margin-bottom: 8px; }
    .row input { font-size: 13px; padding: 8px 10px; }
    .row-actions { display: flex; gap: 4px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .msg.error { color: #f87171; }
    .msg.ok { color: var(--ok); }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
    @media (max-width: 680px) {
      .row-head { display: none; }
      .row { grid-template-columns: 48px 1fr; grid-auto-rows: auto; }
      .row input { grid-column: 1 / -1; }
      .row-actions { grid-column: 1 / -1; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="loginPanel" class="panel hidden">
      <h1>管理员登录</h1>
      <form id="loginForm">
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="totp">动态验证码（6 位）</label>
          <input id="totp" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required />
        </div>
        <button class="primary" type="submit">登录</button>
        <p class="hint">密码 + 手机验证器（TOTP）双重验证</p>
        <p id="loginMsg" class="msg"></p>
      </form>
    </section>

    <section id="editorPanel" class="panel hidden">
      <div class="topbar">
        <h1 style="margin:0">编辑联系方式</h1>
        <button id="logoutBtn" class="small">退出登录</button>
      </div>

      <div class="row-head">
        <span>图标</span><span>名称</span><span>显示内容</span><span>链接</span><span></span>
      </div>
      <div id="rows"></div>

      <div class="toolbar">
        <button id="addBtn" type="button">+ 添加</button>
        <button id="saveBtn" class="primary" type="button">保存</button>
        <button id="reloadBtn" type="button">重新加载</button>
      </div>
      <p id="editorMsg" class="msg"></p>
      <p class="hint">图标可填 emoji；链接需以 http(s)://、mailto: 或 tel: 开头。</p>
    </section>
  </div>

  <script>
    const loginPanel = document.getElementById("loginPanel");
    const editorPanel = document.getElementById("editorPanel");
    const rowsEl = document.getElementById("rows");
    const loginMsg = document.getElementById("loginMsg");
    const editorMsg = document.getElementById("editorMsg");
    let contacts = [];

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = "msg " + (type || "");
    }

    function rowTemplate(item, index) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<input data-k="icon" maxlength="4" value="" placeholder="🔗" />' +
        '<input data-k="label" value="" placeholder="名称" />' +
        '<input data-k="value" value="" placeholder="显示内容" />' +
        '<input data-k="href" value="" placeholder="https://" />' +
        '<div class="row-actions">' +
        '<button type="button" class="small" data-act="up">↑</button>' +
        '<button type="button" class="small" data-act="down">↓</button>' +
        '<button type="button" class="small danger" data-act="del">删</button>' +
        "</div>";
      row.querySelector('[data-k="icon"]').value = item.icon || "";
      row.querySelector('[data-k="label"]').value = item.label || "";
      row.querySelector('[data-k="value"]').value = item.value || "";
      row.querySelector('[data-k="href"]').value = item.href || "";
      row.dataset.index = index;
      row.querySelector('[data-act="up"]').onclick = () => move(index, -1);
      row.querySelector('[data-act="down"]').onclick = () => move(index, 1);
      row.querySelector('[data-act="del"]').onclick = () => removeRow(index);
      return row;
    }

    function renderRows() {
      rowsEl.innerHTML = "";
      contacts.forEach((item, index) => rowsEl.appendChild(rowTemplate(item, index)));
    }

    function collect() {
      return [...rowsEl.querySelectorAll(".row")].map((row, index) => ({
        id: contacts[index]?.id || "item-" + index + "-" + Date.now(),
        icon: row.querySelector('[data-k="icon"]').value,
        label: row.querySelector('[data-k="label"]').value,
        value: row.querySelector('[data-k="value"]').value,
        href: row.querySelector('[data-k="href"]').value,
      }));
    }

    function move(index, delta) {
      const data = collect();
      const target = index + delta;
      if (target < 0 || target >= data.length) return;
      [data[index], data[target]] = [data[target], data[index]];
      contacts = data;
      renderRows();
    }

    function removeRow(index) {
      contacts = collect().filter((_, i) => i !== index);
      renderRows();
    }

    async function loadContacts() {
      const res = await fetch("/api/contacts", { cache: "no-store" });
      const data = await res.json();
      contacts = Array.isArray(data.contacts) ? data.contacts : [];
      renderRows();
    }

    async function checkSession() {
      try {
        const res = await fetch("/api/session", { cache: "no-store" });
        const data = await res.json();
        return !!data.authenticated;
      } catch {
        return false;
      }
    }

    async function showEditor() {
      loginPanel.classList.add("hidden");
      editorPanel.classList.remove("hidden");
      await loadContacts();
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      showMsg(loginMsg, "登录中…", "");
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: document.getElementById("password").value,
            totp: document.getElementById("totp").value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          showMsg(loginMsg, data.error || "登录失败", "error");
          return;
        }
        showMsg(loginMsg, "", "");
        document.getElementById("password").value = "";
        document.getElementById("totp").value = "";
        await showEditor();
      } catch {
        showMsg(loginMsg, "网络错误，请重试", "error");
      }
    });

    document.getElementById("addBtn").onclick = () => {
      contacts = collect();
      contacts.push({ id: "item-" + Date.now(), icon: "🔗", label: "", value: "", href: "" });
      renderRows();
    };

    document.getElementById("reloadBtn").onclick = async () => {
      contacts = collect();
      await loadContacts();
      showMsg(editorMsg, "已重新加载", "ok");
    };

    document.getElementById("saveBtn").onclick = async () => {
      showMsg(editorMsg, "保存中…", "");
      try {
        const res = await fetch("/api/contacts", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contacts: collect() }),
        });
        const data = await res.json();
        if (res.status === 401) {
          showMsg(editorMsg, "会话已过期，请重新登录", "error");
          setTimeout(() => location.reload(), 1200);
          return;
        }
        if (!res.ok) {
          showMsg(editorMsg, data.error || "保存失败", "error");
          return;
        }
        contacts = Array.isArray(data.contacts) ? data.contacts : [];
        renderRows();
        showMsg(editorMsg, "已保存", "ok");
      } catch {
        showMsg(editorMsg, "网络错误，请重试", "error");
      }
    };

    document.getElementById("logoutBtn").onclick = async () => {
      await fetch("/api/logout", { method: "POST" });
      location.reload();
    };

    (async () => {
      if (await checkSession()) {
        await showEditor();
      } else {
        loginPanel.classList.remove("hidden");
      }
    })();
  </script>
</body>
</html>
